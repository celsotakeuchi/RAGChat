# Audience profiles. Each one picks how the assistant behaves, which KB audiences it may search,
# which model serves it and its token limits. The audience of a request comes from the server-side
# session, never from the client.
#
# LLM per profile: provider = ollama_cloud | ollama_local | litellm. Empty fields use the global
# settings (LLM_PROVIDER, OLLAMA_MODEL, ...). For a local model set max_concurrent so a few
# simultaneous visitors cannot saturate it. `fallback` is off by default (add it deliberately; never
# fall back from a private profile to a less private model).
internal:
  base: kb/air_passenger_rights.yaml
  search_audiences: [internal, public]
  llm: {}

public:
  base: kb/air_passenger_rights.yaml
  search_audiences: [public]
  overrides:
    system_prompt: prompts/public.md
    guardrails:
      max_question_chars: 500
      enforce_grounding: true
    ui:
      title: Air passenger rights assistant
      disclaimer: Answers are generated by AI from public information. Do not enter personal data. This is not legal advice.
    messages:
      unknown:
        en: I do not have this information. Please check the official sources or contact the airline.
        es: No tengo esa información. Consulta las fuentes oficiales o contacta con la aerolínea.
  limits:
    max_output_tokens: 400
    max_request_tokens: 5000
    daily_tokens_per_user: 20000
  llm: {}
  # Example: serve the public side with a local model.
  # llm:
  #   provider: ollama_local
  #   model: llama3.1:8b
  #   max_concurrent: 2
  #   queue_wait_s: 5
